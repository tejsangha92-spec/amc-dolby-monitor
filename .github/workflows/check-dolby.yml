name: Check AMC Dolby Showtimes

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: 'Send a test push notification instead of checking showtimes'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-showtimes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium
      
      - name: Restore seen showtimes cache
        uses: actions/cache@v4
        with:
          path: seen_dolby_showtimes.json
          key: seen-showtimes-${{ github.run_id }}
          restore-keys: |
            seen-showtimes-
      
      - name: Send test notification
        if: github.event.inputs.send_test_notification == 'true'
        env:
          IFTTT_WEBHOOK_KEY: ${{ secrets.IFTTT_WEBHOOK_KEY }}
        run: python check_showtimes.py --test

      - name: Check for new Dolby showtimes
        if: github.event.inputs.send_test_notification != 'true'
        env:
          IFTTT_WEBHOOK_KEY: ${{ secrets.IFTTT_WEBHOOK_KEY }}
        run: python check_showtimes.py

      - name: Publish updated website
        if: github.event.inputs.send_test_notification != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && echo "No site changes" || (git commit -m "Update showtimes website" && git push)
