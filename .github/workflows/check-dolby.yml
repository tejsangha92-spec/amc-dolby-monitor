name: Check AMC Dolby Showtimes

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check-showtimes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      
      - name: Restore seen showtimes cache
        uses: actions/cache@v4
        with:
          path: seen_dolby_showtimes.json
          key: seen-showtimes-${{ github.run_id }}
          restore-keys: |
            seen-showtimes-
      
      - name: Check for new Dolby showtimes
        env:
          IFTTT_WEBHOOK_KEY: ${{ secrets.IFTTT_WEBHOOK_KEY }}
          THEATER_SLUG: ${{ vars.THEATER_SLUG }}
        run: python check_showtimes.py
